# Install as a separate virtual host; no changes to existing BeefAPI upstreams.
server {
    listen 80;
    listen [::]:80;
    server_name partner.bflabs.app;
    location ^~ /.well-known/acme-challenge/ { root /var/www/partner-demo-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name partner.bflabs.app;
    ssl_certificate /etc/letsencrypt/live/partner.bflabs.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/partner.bflabs.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    location / {
        proxy_pass http://127.0.0.1:4316;
        proxy_set_header Host partner.bflabs.app;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }
}
